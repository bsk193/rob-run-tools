<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>Raid Planner · ROB RUN Tools</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">R</span><span>ROB RUN TOOLS</span></a>
      <nav class="nav" aria-label="Main navigation">
        <a href="notoriety.html">Sale Planner</a>
        <a href="raids.html" aria-current="page">Raid Planner</a>
      </nav>
    </div>
  </header>
  <main class="page page-narrow">
    <div class="page-head"><p class="eyebrow">Decoder inventory</p><h1>Raid Planner</h1></div>
    <section class="raid-surface surface" aria-label="Raid planning calculator">
      <div class="summary" aria-live="polite" aria-atomic="true">
        <div class="summary-item"><span class="summary-label">Decoders</span><strong class="summary-value" id="decoder-count">0</strong></div>
        <div class="summary-item"><span class="summary-label">Breach points</span><strong class="summary-value" id="decoder-points">0</strong></div>
      </div>
      <div class="tabs" role="tablist" aria-label="Planner sections">
        <button class="tab" id="inventory-tab" type="button" role="tab" aria-controls="inventory-panel" aria-selected="true">Inventory</button>
        <button class="tab" id="targets-tab" type="button" role="tab" aria-controls="targets-panel" aria-selected="false">Targets</button>
      </div>
      <section id="inventory-panel" class="tab-panel" role="tabpanel" aria-labelledby="inventory-tab">
        <h2>Your decoders</h2>
        <div class="decoder-grid">
          <label class="decoder-card" for="green-count">
            <span class="decoder-top"><span class="decoder-name"><span class="tier-dot tier-green" aria-hidden="true"></span>Green</span><span class="point-chip">1 point</span></span>
            <input id="green-count" type="number" min="0" step="1" value="0" inputmode="numeric" aria-label="Green decoder count">
          </label>
          <label class="decoder-card" for="purple-count">
            <span class="decoder-top"><span class="decoder-name"><span class="tier-dot tier-purple" aria-hidden="true"></span>Purple</span><span class="point-chip">3 points</span></span>
            <input id="purple-count" type="number" min="0" step="1" value="0" inputmode="numeric" aria-label="Purple decoder count">
          </label>
          <label class="decoder-card" for="gold-count">
            <span class="decoder-top"><span class="decoder-name"><span class="tier-dot tier-gold" aria-hidden="true"></span>Gold</span><span class="point-chip">5 points</span></span>
            <input id="gold-count" type="number" min="0" step="1" value="0" inputmode="numeric" aria-label="Gold decoder count">
          </label>
        </div>
      </section>
      <section id="targets-panel" class="tab-panel" role="tabpanel" aria-labelledby="targets-tab" hidden>
        <h2>Targets</h2>
        <label class="toggle" for="bunker-bonus">
          <input id="bunker-bonus" type="checkbox">
          <span>Bunker defense +3</span>
          <button class="info" type="button" title="Adds 3 defense to structures in a settlement with a Bunker." aria-label="Bunker defense details">i</button>
        </label>
        <div class="table-wrap target-table">
          <table>
            <thead><tr><th>Structure</th><th class="numeric">Fuse slots</th><th class="numeric"><span title="Defense when empty to defense when all slots have Gold fuses.">Defense</span></th><th class="numeric">Status</th></tr></thead>
            <tbody id="target-rows"></tbody>
          </table>
        </div>
      </section>
      <p class="footer-note">Defense values are estimates. Confirm the load in-game.</p>
    </section>
  </main>
  <script>
    (() => {
      const inputs = [
        document.getElementById("green-count"),
        document.getElementById("purple-count"),
        document.getElementById("gold-count")
      ];
      const bunkerInput = document.getElementById("bunker-bonus");
      const structures = [
        { name: "Trailer", base: 5, slots: 9 },
        { name: "Small House", base: 15, slots: 27 },
        { name: "Mansion", base: 30, slots: 42 },
        { name: "Car Garage", base: 4, slots: 6 },
        { name: "Large Car Garage", base: 6, slots: 12 },
        { name: "Warehouse", base: 10, slots: 15 },
        { name: "Crypto Farm Warehouse", base: 5, slots: 9 },
        { name: "Workshop", base: 5, slots: 9 },
        { name: "Grow Room", base: 5, slots: 9 },
        { name: "Chemical Laboratory", base: 3, slots: 6 },
        { name: "Mesh Fence", base: 2, slots: 3 },
        { name: "Metal Fence", base: 5, slots: 6 },
        { name: "Concrete Fence", base: 10, slots: 9 },
        { name: "Checkpoint / settlement gate", base: 10, slots: 0 }
      ];
      const output = (id) => document.getElementById(id);

      function count(input) { return Math.max(0, Math.floor(Number(input.value) || 0)); }

      function update() {
        const [green, purple, gold] = inputs.map(count);
        const total = green + purple + gold;
        const points = green + purple * 3 + gold * 5;
        const bunker = bunkerInput.checked ? 3 : 0;
        output("decoder-count").textContent = String(total);
        output("decoder-points").textContent = String(points);
        output("target-rows").innerHTML = structures.map((structure) => {
          const min = structure.base + bunker;
          const max = min + structure.slots * 5;
          let status;
          let kind;
          let detail;
          if (points < min) {
            status = "Short " + (min - points);
            kind = "bad";
            detail = "Need " + (min - points) + " more breach point" + (min - points === 1 ? "" : "s") + " for an empty target.";
          } else if (points >= max) {
            status = "Guaranteed";
            kind = "good";
            detail = "Enough points even with every fuse slot filled with Gold.";
          } else {
            status = "Depends on load";
            kind = "maybe";
            const fusePoints = points - min;
            detail = "Can cover up to " + fusePoints + " fuse point" + (fusePoints === 1 ? "" : "s") + "; scout the actual load.";
          }
          return "<tr><td>" + structure.name + "</td><td class=\"numeric\">" + structure.slots + "</td><td class=\"numeric\">" + min + "–" + max + "</td><td class=\"numeric\"><span class=\"outlook " + kind + "\" title=\"" + detail + "\">" + status + "</span></td></tr>";
        }).join("");
      }

      for (const input of inputs) input.addEventListener("input", update);
      bunkerInput.addEventListener("change", update);
      const tabs = [
        { button: output("inventory-tab"), panel: output("inventory-panel") },
        { button: output("targets-tab"), panel: output("targets-panel") }
      ];
      for (const tab of tabs) {
        tab.button.addEventListener("click", () => {
          for (const item of tabs) {
            const active = item === tab;
            item.button.setAttribute("aria-selected", String(active));
            item.panel.hidden = !active;
          }
        });
      }
      update();
    })();
  </script>
</body>
</html>
